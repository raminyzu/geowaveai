
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geowaveai"
version = "0.1.0"
description = "A research framework for geophysical signal processing and microseismic event detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
    "obspy==1.5.1",
    "notebook==7.6.4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
